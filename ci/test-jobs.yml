test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
        - pyproject.toml
    paths:
      - .uv-cache/
  script:
    - uv run --locked python run_tests.py
  after_script:
    - uv cache prune --ci
  artifacts:
    reports:
      junit: reports.xml
    when: always
  rules:
